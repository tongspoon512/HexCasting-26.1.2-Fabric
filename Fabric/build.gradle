plugins {
    id 'fabric-loom' version "1.19-SNAPSHOT"
}

loom {
    accessWidenerPath = file("src/main/resources/fabricasting.accesswidener")

    runs {
        client {
            client()
            setConfigName("Fabric Client")
        }
        server {
            server()
            setConfigName("Fabric Server")
        }
        datagen {
            client()
            vmArg "-Dfabric-api.datagen"
            vmArg "-Dfabric-api.datagen.modid=${modID}"
            vmArg "-Dfabric-api.datagen.output-dir=${file("src/generated/resources")}"
        }

        configureEach {
            runDir "run"
            ideConfigGenerated(true)
        }
    }
}

repositories {
    mavenCentral()

    // modmenu and clothconfig
    maven { url "https://maven.terraformersmc.com/" }
    maven { url "https://maven.shedaniel.me/" }
    maven { url 'https://maven.ladysnake.org/releases' }
    // JEI fallback mirror
    maven { url "https://modmaven.dev" }
    exclusiveContent {
        forRepository {
            maven { url = "https://api.modrinth.com/maven" }
        }
        filter { includeGroup "maven.modrinth" }
    }
    // pehkui
    maven { url = "https://jitpack.io" }

    // If you have mod jar dependencies in ./libs, you can declare them as a repository like so:
    flatDir {
        dir 'libs'
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraftVersion}"
    // MC 26.1.2 ships with official Mojang names directly (unobfuscated jar).
    // Obfuscation is disabled (fabric.loom.disableObfuscation=true), so no
    // mappings configuration is needed — source == production == official.
    implementation("net.fabricmc:fabric-language-kotlin:${fabricLanguageKotlinVersion}")
    implementation "net.fabricmc:fabric-loader:${fabricLoaderVersion}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabricVersion}"

    // Reqs
    compileOnly "org.jetbrains:annotations:$jetbrainsAnnotationsVersion"
    testCompileOnly "org.jetbrains:annotations:$jetbrainsAnnotationsVersion"
    compileOnly "com.demonwav.mcdev:annotations:1.0"

    implementation group: 'com.google.code.findbugs', name: 'jsr305', version: '3.0.1'
    compileOnly project(":Common")

    // paucal is vendored as source
    // patchouli is not available for 26.1 (guide book stubbed)
    // inline is not available for 26.1 (text API stubbed)

    // MoreIotas: 矩阵运算（EJML，jar-in-jar 打包）
    implementation "org.ejml:ejml-simple:$ejmlVersion"
    include "org.ejml:ejml-simple:$ejmlVersion"
    implementation "org.ejml:ejml-core:$ejmlVersion"
    include "org.ejml:ejml-core:$ejmlVersion"
    implementation "org.ejml:ejml-ddense:$ejmlVersion"
    include "org.ejml:ejml-ddense:$ejmlVersion"

    implementation "org.ladysnake.cardinal-components-api:cardinal-components-base:$cardinalComponentsVersion"
    implementation "org.ladysnake.cardinal-components-api:cardinal-components-entity:$cardinalComponentsVersion"
    implementation "org.ladysnake.cardinal-components-api:cardinal-components-item:$cardinalComponentsVersion"
    implementation "org.ladysnake.cardinal-components-api:cardinal-components-block:$cardinalComponentsVersion"

    // bundled serialization hooks (stubbed as source for 26.1 official mappings)
    // implementation "${modID}:serialization-hooks:$serializationHooksVersion"
    // include "${modID}:serialization-hooks:$serializationHooksVersion"
    implementation(include("com.github.LlamaLad7:MixinExtras:0.1.1"))

    // Optional integrations

    // cloth-config is a hard runtime dependency (config screen)
    implementation("me.shedaniel.cloth:cloth-config-fabric:$clothConfigVersion") {
        exclude(group: "net.fabricmc.fabric-api")
    }

    compileOnly("mezz.jei:jei-${minecraftVersion}-fabric-api:${jeiVersion}")
    runtimeOnly("mezz.jei:jei-${minecraftVersion}-fabric:${jeiVersion}")

    compileOnly("com.github.Virtuoel:Pehkui:${pehkuiVersion}", {
        exclude group: "net.fabricmc.fabric-api"
    })

    // optional (mod menu entrypoint); no compatible build for this snapshot
    compileOnly("com.terraformersmc:modmenu:$modmenuVersion")

    // Create-Fly (mod id "create") — optional integration for HexCreating content.
    // The jar is already in official Mojang names, matching disableObfuscation.
    compileOnly files(rootProject.file("libs/create-fly-26.1.2-6.0.9-4.jar"))
    runtimeOnly files(rootProject.file("libs/create-fly-26.1.2-6.0.9-4.jar"))
}

tasks.named("compileJava", JavaCompile) {
    source(project(":Common").sourceSets.main.allSource)
}
// Loom defaults to running the client under xvfb-run, which is not installed here.
tasks.withType(net.fabricmc.loom.task.RunGameTask).configureEach {
    useXvfb.set(false)
}
compileKotlin {
    source(project(":Common").sourceSets.main.kotlin)
}

sourcesJar {
    from project(":Common").sourceSets.main.allJava
}

sourceSets {
    main.resources.srcDirs += ['src/generated/resources', '../Common/src/generated/resources']
}

processResources {
    from project(":Common").sourceSets.main.resources
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}
